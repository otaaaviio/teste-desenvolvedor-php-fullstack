services:
    vite:
        container_name: 'vite'
        image: 'node:22-alpine'
        command: 'sh -c "npm install && npm run dev"'
        volumes:
            - '.:/app'
        working_dir: '/app'
        ports:
            - '5173:5173'
        networks:
            - vite-net
networks:
    vite-net:
        driver: bridge

