name: Verify Code Quality and Formatting

on:
  push:
    branches: ["feat/otavio-goncalves"]
    paths:
      - "backend/**"
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-quality:

    runs-on: ubuntu-latest

    steps:
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.3'
      - uses: actions/checkout@v4
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
        working-directory: backend
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
        working-directory: backend
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
        working-directory: backend
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --no-interaction --configuration=phpstan.neon
        working-directory: backend
      - name: Run Pint
        run: vendor/bin/pint --test --no-interaction
        working-directory: backend